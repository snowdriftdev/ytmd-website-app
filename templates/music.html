<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Control my music player!</title>
    <meta name="darkreader-lock">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: transparent;
            background: black;
        }
        #album-artwork {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: var(--bg-art);
            background-size: cover;
            filter: blur(45px);
            transform: scale(1.3);
            opacity: 0.6;
        }
        #panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 32px;
            border-radius: 16px;
            background: rgba(20,20,20,0.3)

        }

    </style>
</head>
<body>
    <div id="panel">
        <img id="album-artwork" src="" />
        <span id="song-title"></span>
        <span id="artist-name"></span>
        <progress id="progress" value="0" max="100"></progress>

        <button id="btn-prev">&lt;</button>
        <button id="btn-play-pause">Play/Pause</button>
        <button id="btn-next">&gt;</button>
    </div>

    <script>
        const source = new EventSource("/events");
        source.onmessage = (event) => {
            // update all the current video/track state info from the websocket
            const data = JSON.parse(event.data);
            if(!data.video) return;
            document.getElementById("album-artwork").src = data.video.thumbnails.at(-1).url;
            document.getElementById("song-title").textContent = data.video.title;
            document.getElementById("artist-name").textContent = data.video.author;
            document.getElementById("progress").value = data.player.videoProgress;
            document.getElementById("progress").max = data.video.durationSeconds;
            document.body.style.setProperty("--bg-art", `url("${data.video.thumbnails.at(-1).url}")`);
        }

        async function sendCommand(command) {
            await fetch("/command", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({command})
            })
        }

        document.getElementById("btn-play-pause").addEventListener("click", () => {
            sendCommand("toggle_play_pause");
        });
        document.getElementById("btn-next").addEventListener("click", () => {
            sendCommand("next_song")
        })
        document.getElementById("btn-prev").addEventListener("click", () => {
            sendCommand("previous_song")
        })
    </script>
</body>
</html>
